[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speakwell-engine"
version = "0.1.0"
description = "SpeakWell local speech analysis engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
vision = ["mediapipe>=0.10.14", "opencv-python>=4.8"]
voice = ["praat-parselmouth>=0.4"]   # GPL-3.0: read docs/MODELS.md before distributing a build that includes it
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
speakwell-engine = "speakwell.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["speakwell*"]

[tool.setuptools.package-data]
speakwell = ["content/**/*.json"]
